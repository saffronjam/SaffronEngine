[package]
name = "saffron-editor"
version = "0.1.0"
description = "Saffron Anima TypeScript editor shell"
edition = "2024"
rust-version = "1.85"

[lib]
name = "saffron_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"

# Store connectors (editor-side only): async HTTP to the asset services, the async
# connector trait, per-connector error enums, and async session locks. There is no
# outbound HTTP anywhere in the engine — connectors live solely in this bridge.
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

# OS keyring for connector credentials, pure-Rust Secret Service (zbus, no system dbus
# dev libs needed at build) so it compiles in the toolbox; a headless fallback in
# credentials.rs degrades to in-memory when no Secret Service daemon is present.
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

# Extract ambientCG / Poly Haven material map zips into a role-named folder the host's
# material importer consumes.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Logging: the bridge shares the engine's compact `tracing` format via the leaf
# `saffron-log` crate (no other engine code is pulled in), and emits its own lines
# (`viewport` / `saffron` subsystems) through the `tracing` macros.
tracing = "0.1"
saffron-log = { path = "../../engine/crates/log" }

# The wayland subsurface presenter: GTK/GDK access for the transparent toplevel prep
# (versions track what tauri/wry already resolve so the types unify), and the wayland
# crates drive the subsurface over GTK's own connection (system libwayland backend),
# presenting the engine's frames at the monitor's refresh rate.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.20"
webkit2gtk = "2.0"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
