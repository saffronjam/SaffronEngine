[package]
name = "saffron-editor-shell"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "saffron-editor-shell"
path = "src/main.rs"

# The macOS CEF helper: every helper .app inside the bundle runs this binary (a no-op stub on
# other targets). The `bundle` bin assembles the .app layout; both are macOS-bodied.
[[bin]]
name = "saffron-editor-shell-helper"
path = "src/helper_main.rs"

[[bin]]
name = "bundle"
path = "src/bin/bundle.rs"

# Consumed by `cef::build_util::mac::build_bundle` (the `bundle` bin): which helper executable the
# five helper .apps wrap.
[package.metadata.cef.bundle]
helper_name = "saffron-editor-shell-helper"

# The CEF/Chromium 149 line, pinned exactly (pre-1.0 binding; the `<crate-semver>+<cef-version>`
# scheme means the exact CEF build is reproducible). cef-dll-sys is the FFI crate pulled by `cef`;
# pinned explicitly per the Phase 1 provisioning decision. Its build.rs downloads the version-locked
# CEF binary distribution (or reuses `CEF_PATH` when set).
[dependencies]
cef = "=149.3.0"
cef-dll-sys = "=149.3.0"
# The host toplevel: winit owns one toplevel and the event loop that pumps CEF. The platform
# backend (`src/backend/`) recovers the raw window-system handles via raw-window-handle.
winit = "0.30"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"

# The Asset Store connectors (editor-only outbound HTTP): the async connector trait, per-provider
# clients, the OS-keyring credential store, and zip extraction for material map sets. A tokio runtime
# runs the async connector methods from the sync command dispatch (`block_on`). Identical crate set to
# the connector backend; the provider code is unchanged.
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing = "0.1"
# Unified logging: the shell emits through the engine's `saffron-log` compact formatter
# (timestamp · level · subsystem), so the shell's own lines and the spawned host's lines share one
# format in the combined stdout instead of the shell using ad-hoc `eprintln!`. `tracing` above is the
# facade; `saffron-log::init_logging` installs the subscriber. Path dep across the editor/engine
# boundary — a deliberate, sanctioned coupling for one consistent log format.
saffron-log = { path = "../../engine/crates/log" }
saffron-protocol = { path = "../../engine/crates/protocol" }

# The Wayland backend (`src/backend/wayland/`): CEF's OSR buffer composites onto the toplevel
# wl_surface via wl_shm, sharing winit's wl_display through libwayland (`client_system` →
# `Backend::from_foreign_display`); the engine presenter drives wl_subsurfaces with `wp_viewporter`
# scaling and `wp_presentation` refresh feedback. These crates link the system libwayland via
# pkg-config, so they exist only on the Linux target. The keyring store is the DBus Secret Service;
# rfd's pickers ride the XDG desktop portal.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# The AppKit backend (`src/backend/appkit/`): CALayers under the winit NSView present both the CEF
# UI (IOSurface pool as layer contents) and the engine viewport frames, paced by NSView.displayLink.
# The keyring store is the macOS Keychain; rfd's pickers are native AppKit panels.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-io-surface = "0.3"
objc2-core-foundation = "0.3"
keyring = { version = "3", default-features = false, features = ["apple-native"] }
rfd = { version = "0.15", default-features = false, features = ["tokio"] }
