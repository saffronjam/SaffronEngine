# Runs only on a self-hosted runner labelled `saffron-build`, on a host carrying the
# `saffron-build` toolbox (Rust/cargo + xtask, the Vulkan SDK, SDL3, slang), bun on
# PATH, and weston for a headless Wayland display — the engine smoke and the schema
# contract test open a Vulkan swapchain. There is no hosted fallback; without such a
# runner the workflow queues. The everyday gate is tools/ci/check.sh in the toolbox.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: [self-hosted, saffron-build]

    env:
      PATH: /var/home/saffronjam/.bun/bin:/usr/local/bin:/usr/bin:/bin
      WAYLAND_DISPLAY: wl-ci
      SDL_VIDEODRIVER: wayland

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start headless weston
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          weston --backend=headless --width=1280 --height=720 \
                 --socket=wl-ci --idle-time=0 &
          echo "WESTON_PID=$!" >> "$GITHUB_ENV"
          # Wait for the compositor to create the wl-ci socket.
          sleep 2

      - name: Run reproducible gate (tools/ci/check.sh)
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          tools/ci/check.sh

      - name: Stop headless weston
        if: always()
        run: |
          if [ -n "${WESTON_PID:-}" ]; then
            kill "$WESTON_PID" 2>/dev/null || true
          fi
