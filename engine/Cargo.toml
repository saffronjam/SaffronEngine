[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"
license = "MIT"
authors = ["Saffron Anima"]

# Member crates pull each dep via `dep.workspace = true`, so versions never drift.
[workspace.dependencies]
# Vulkan (saffron-rendering).
ash = "=0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
vk-mem = "0.4"

# Window (saffron-window).
winit = "0.30"

# ECS behind saffron-scene — wrapped, never named outside that crate.
hecs = "0.11"

# Math (saffron-geometry and most).
glam = "0.30"

# Scripting (saffron-script) — Luau VM, vendored.
mlua = { version = "0.11", features = ["luau", "vendored"] }

# Serde stack — JSON, wire, schema, errors.
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` makes `serde_json::Map` insertion-ordered: results emit keys in DTO field
# order and OpenRPC schemas in registration order, so codegen is byte-reproducible.
serde_json = { version = "1.0", features = ["preserve_order"] }
# `schemars_1` so the serde_with adapters carry their `Schema` impls into the schemars 1
# (draft 2020-12) the control DTOs declare.
serde_with = { version = "3", features = ["schemars_1"] }
schemars = "1"
ts-rs = "10"

# Physics FFI (saffron-physics-sys) — vendored Jolt 5.3.0 via cxx.
cxx = "1.0"
cxx-build = "1.0"

# Importers & images (saffron-geometry, saffron-rendering).
gltf = { version = "1.4", features = ["extras"] }
tobj = "4.0"
image = "0.25"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
optimesh = "1.1.0"
zstd = { version = "=0.13.3", default-features = false }

# Syscalls & CLI.
rustix = "0.38"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Filesystem walk for the asset catalog scan — order is only deterministic once sorted.
walkdir = "2.5"
atomic-write-file = "0.3"
sha2 = "0.10"

# GPU struct casts.
bytemuck = { version = "1", features = ["derive"] }

# Control-protocol blobs.
base64 = "0.22"

# Error model.
anyhow = "1"
thiserror = "2"

# Logging — `tracing` is the event/span API every crate emits through; the rest is the
# saffron-log subscriber stack.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "fmt",
    "env-filter",
    "std",
] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
nu-ansi-term = "0.50"

# Astronomical time-of-day driver (full NREL Solar Position Algorithm).
solar-positioning = { version = "0.5.2", default-features = false, features = ["std"] }

# Benchmark harness (dev-only).
criterion = "0.7"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
incremental = false

[profile.test]
incremental = false

# Dependencies are optimized even in a debug engine build, so it stays fast enough to run.
[profile.dev.package."*"]
opt-level = 3

# `panic = "unwind"` is required: the FFI/shm seams unwind across the Rust/C++ boundary.
[profile.release]
opt-level = 3
debug = true
panic = "unwind"
